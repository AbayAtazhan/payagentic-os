services:
  - type: web
    name: proofpay
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: DEMO_FREELANCER_EMAIL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: PROOFPAY_SECRET
        generateValue: true
