openapi: 3.1.0
info:
  title: PayAgentic OS & PayPal REST Sandbox API Contract
  version: 1.0.0
  description: >
    Formal OpenAPI 3.1 contract utilized by APIMatic Context Plugins to ground AI Agent
    tool-calling and ensure zero parameter hallucination when interacting with PayPal.
servers:
  - url: https://api-m.sandbox.paypal.com
    description: PayPal Sandbox Environment
  - url: http://localhost:3000/api
    description: PayAgentic Local Server
paths:
  /v1/oauth2/token:
    post:
      summary: Obtain OAuth 2.0 Access Token
      operationId: getAccessToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  default: client_credentials
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer

  /v2/invoicing/invoices:
    get:
      summary: List Invoices
      operationId: listInvoices
      responses:
        '200':
          description: List of invoice summaries
    post:
      summary: Create Draft Invoice
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [detail, primary_recipients, items]
              properties:
                detail:
                  type: object
                  properties:
                    currency_code:
                      type: string
                    invoice_date:
                      type: string
                primary_recipients:
                  type: array
                  items:
                    type: object
                items:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Invoice successfully created

  /v2/invoicing/invoices/{id}/send:
    post:
      summary: Send Invoice to Recipient
      operationId: sendInvoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invoice sent

  /v1/payments/payouts:
    post:
      summary: Create Payout Batch
      operationId: createPayoutBatch
      parameters:
        - name: PayPal-Request-Id
          in: header
          description: Idempotency Key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sender_batch_header, items]
              properties:
                sender_batch_header:
                  type: object
                items:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Payout batch queued for processing

  /v1/reporting/balances:
    get:
      summary: Get Account Balances
      operationId: getBalances
      responses:
        '200':
          description: Currency balances returned
